# Основной сервер
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;

    # Пути к SSL-сертификатам (используются только при подключении по 443 порту)
    ssl_certificate /etc/nginx/ssl/nginx-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx-selfsigned.key;

    # Отключаем принудительный редирект на HTTPS для локальной разработки на Windows,
    # чтобы избежать ошибок 400/403 и проблем с самоподписанными сертификатами.

    client_max_body_size 20M;

    # React-приложение — отдаётся с корня
    location / {
        root /var/www/SHOP/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /sekretnaya-panel-upravleniya-shop2026/ {
        client_max_body_size 50M;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /var/www/SHOP/staticfiles/;
    }

    location /media/ {
        alias /var/www/SHOP/media/;
    }

    access_log /dev/stdout;
    error_log  /dev/stderr;
}