# Основной сервер
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;

    # Пути к SSL-сертификатам (используются только при подключении по 443 порту)
    ssl_certificate /etc/nginx/ssl/nginx-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx-selfsigned.key;

    # Отключаем принудительный редирект на HTTPS для локальной разработки на Windows,
    # чтобы избежать ошибок 400/403 и проблем с самоподписанными сертификатами.

    client_max_body_size 50M;

    # Сжатие ответов — уменьшает объём передаваемых данных (HTML/JS/CSS/JSON)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # React-приложение — отдаётся с корня
    location / {
        root /var/www/SHOP/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location /sekretnaya-panel-upravleniya-shop2026/ {
        client_max_body_size 50M;
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location /static/ {
        alias /var/www/SHOP/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /var/www/SHOP/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Кэш для собранных JS/CSS ассетов React (у Vite имена файлов с хешем в них,
    # так что immutable-кэш безопасен — при изменении кода имя файла тоже изменится)
    location ~* \.(js|css|woff2?|ttf|eot|svg)$ {
        root /var/www/SHOP/frontend/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    access_log /dev/stdout;
    error_log  /dev/stderr;
}